name: Daily Update & Deploy

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

# Permissions for committing changes and deploying to Pages
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write  # dispatch build-wheel on PyMuPDF pin/wheel drift

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # 1. Checkout with submodules
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Update Submodule logic
      - name: Update Python Core Submodule
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git submodule update --remote --merge

      # 3. Check if there are changes
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in submodule."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      # 4. Commit & Push (Only if changes exist)
      - name: Commit and Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add public/python_core
          git commit -m "chore(submodule): daily update of python core logic"
          git push origin main

      # 4b. Wheel drift healing: if the core's PyMuPDF pin moved past the committed
      # wheel (e.g. a dependabot bump auto-merged in the core repo), rebuild the
      # WASM wheel automatically. build-wheel's smoke test is the gate; a red run
      # surfaces through the usual workflow-failure alerting.
      - name: Detect PyMuPDF wheel drift → trigger rebuild
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PIN=$(grep -oE 'PyMuPDF==[0-9.]+' public/python_core/requirements.txt | cut -d= -f3 || true)
          WHEEL=$(python3 -c "import json; print(json.load(open('pyodide-versions.json'))['pymupdf'])" 2>/dev/null || true)
          if [ -n "$PIN" ] && [ -n "$WHEEL" ] && [ "$PIN" != "$WHEEL" ]; then
            echo "PyMuPDF drift: wheel=$WHEEL vs core pin=$PIN → dispatching build-wheel"
            gh workflow run build-wheel.yml -R "$GITHUB_REPOSITORY" -f pymupdf_version="$PIN"
          else
            echo "No drift (wheel=$WHEEL, core pin=$PIN)"
          fi

      # 5. Setup Node (Always run build/deploy to ensure latest state, or strictly if changed)
      # We proceed to build/deploy EITHER if there were changes OR if it was a manual trigger.
      # But for a daily cron, we usually only want to deploy if there WAS a change.
      # However, running build every time ensures no drift. Let's run it always to be safe,
      # or strictly `if: steps.check_changes.outputs.has_changes == 'true'` to save resources.
      # Let's save resources: Only deploy if updated or manually triggered.
      
      - name: Set up Node
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Setup Pages
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v5