# Workflow for deploying the PDF Watermark Remover (WASM/PWA) to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # CRITICAL: Fetch the python_core submodule
          fetch-depth: 0         # Fetch all history for proper submodule updates

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20       # Use Active LTS
          cache: 'npm'

      - name: Install dependencies
        run: npm ci              # Use 'ci' for clean, reproducible installs

      - name: Build
        run: npm run build       # Vite build: copies public/ (with wheels & python_core) to dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
