# Workflow for deploying the PDF Watermark Remover (WASM/PWA) to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Daily deploy — pulls the latest python_core submodule at deploy time.
  # Replaces the retired update-submodule.yml (which auto-committed the bump to main → blocked by branch protection).
  schedule:
    - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive  # CRITICAL: Fetch the python_core submodule
          fetch-depth: 0         # Fetch all history for proper submodule updates

      - name: Update python_core submodule to latest
        # Deploy always ships the newest pdf-watermark-remove logic (no commit to main needed).
        run: git submodule update --remote --merge

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci              # Use 'ci' for clean, reproducible installs

      - name: Build
        run: npm run build       # Vite build: copies public/ (with wheels & python_core) to dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
