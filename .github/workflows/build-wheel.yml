name: Build PyMuPDF WASM Wheel

on:
  # Monthly rebuild to keep wheel up-to-date
  schedule:
    - cron: '0 3 1 * *'  # 1st of every month at 03:00 UTC

  # Manual trigger with configurable versions
  workflow_dispatch:
    inputs:
      pyodide_version:
        description: 'Pyodide version for build + smoke test (e.g. 0.26.4)'
        required: false
        default: '0.26.4'
      pymupdf_version:
        description: 'PyMuPDF version (e.g. 1.26.7, or empty for latest)'
        required: false
        default: ''

# Allow pushing commits
permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYODIDE_VER: ${{ inputs.pyodide_version || '0.26.4' }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build PyMuPDF WASM wheel with cibuildwheel
        run: |
          echo "=== Building PyMuPDF WASM wheel ==="
          echo "Pyodide version: ${{ env.PYODIDE_VER }}"

          pip install cibuildwheel

          # Clone PyMuPDF source
          PYMUPDF_VER="${{ inputs.pymupdf_version }}"
          if [ -n "$PYMUPDF_VER" ]; then
            echo "Cloning PyMuPDF version: $PYMUPDF_VER"
            git clone --depth 1 --branch "$PYMUPDF_VER" https://github.com/pymupdf/PyMuPDF.git /tmp/PyMuPDF
          else
            echo "Cloning PyMuPDF latest"
            git clone --depth 1 https://github.com/pymupdf/PyMuPDF.git /tmp/PyMuPDF
          fi

          cd /tmp/PyMuPDF

          # Build WASM wheel using cibuildwheel with Pyodide platform
          CIBW_ENVIRONMENT_PASS_LINUX="HAVE_LIBCRYPTO HAVE_TESSERACT" \
          HAVE_LIBCRYPTO=no \
          HAVE_TESSERACT=0 \
          CIBW_BUILD="cp312-*" \
          CIBW_DEPENDENCY_VERSIONS_PYODIDE="pinned" \
          cibuildwheel --platform pyodide --output-dir /tmp/wheelhouse

          echo "=== Build complete ==="
          ls -lh /tmp/wheelhouse/

      - name: Find and verify wheel
        id: wheel
        run: |
          echo "=== Searching for built wheel ==="
          WHEEL=$(find /tmp/wheelhouse -name "*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: No wheel file found!"
            exit 1
          fi
          echo "Found wheel: $WHEEL"
          ls -lh "$WHEEL"
          WHEEL_NAME=$(basename "$WHEEL")
          echo "wheel_path=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$WHEEL_NAME" >> "$GITHUB_OUTPUT"

          # Copy to public/wheels/
          cp "$WHEEL" "${{ github.workspace }}/public/wheels/"
          echo "Copied to public/wheels/$WHEEL_NAME"

      - name: Setup Node.js for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Smoke test — verify wheel loads in Pyodide
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Smoke test: loading wheel in Pyodide (Node.js) ==="
          npm install pyodide@${{ env.PYODIDE_VER }}

          node << 'NODEEOF'
          const { loadPyodide } = require("pyodide");

          async function main() {
            console.log("Loading Pyodide...");
            const pyodide = await loadPyodide();

            console.log("Installing micropip...");
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");

            const wheelName = "${{ steps.wheel.outputs.wheel_name }}";
            console.log(`Installing wheel: ${wheelName}`);
            await micropip.install(`file:public/wheels/${wheelName}`);

            console.log("Testing import fitz...");
            const result = await pyodide.runPythonAsync(`
          import fitz
          version = fitz.version
          print(f"PyMuPDF version: {version}")
          f"PyMuPDF {version[0]} loaded successfully"
            `);
            console.log(`Result: ${result}`);
            console.log("Smoke test PASSED!");
          }

          main().catch(e => {
            console.error("Smoke test FAILED:", e.message);
            process.exit(1);
          });
          NODEEOF

      - name: Commit wheel to repo
        run: |
          WHEEL_NAME="${{ steps.wheel.outputs.wheel_name }}"
          OLD_WHEELS=$(ls public/wheels/*.whl 2>/dev/null | grep -v "$WHEEL_NAME" || true)

          # Remove old wheel(s) if filename changed
          if [ -n "$OLD_WHEELS" ]; then
            echo "Removing old wheel(s): $OLD_WHEELS"
            rm -f $OLD_WHEELS
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/wheels/

          # Check if wheel actually changed
          if git diff --cached --quiet; then
            echo "Wheel unchanged, skipping commit."
          else
            # Update worker.js if wheel filename changed
            CURRENT_WHEEL=$(grep -oP "wheels/[^'\"]*\.whl" public/worker.js || true)
            if [ -n "$CURRENT_WHEEL" ] && [ "$CURRENT_WHEEL" != "wheels/$WHEEL_NAME" ]; then
              echo "Updating PYMUPDF_WHEEL_PATH in worker.js: $CURRENT_WHEEL → wheels/$WHEEL_NAME"
              sed -i "s|$CURRENT_WHEEL|wheels/$WHEEL_NAME|g" public/worker.js
              git add public/worker.js

              # Also update sw.js if it references the wheel
              if grep -q "$CURRENT_WHEEL" public/sw.js; then
                sed -i "s|$CURRENT_WHEEL|wheels/$WHEEL_NAME|g" public/sw.js
                git add public/sw.js
              fi
            fi

            git commit -m "ci: rebuild PyMuPDF WASM wheel ($WHEEL_NAME)

          Pyodide: ${{ env.PYODIDE_VER }}
          Smoke test: passed"
            git push
            echo "Committed and pushed new wheel."
          fi

      - name: Upload wheel as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: pymupdf-wasm-wheel
          path: public/wheels/${{ steps.wheel.outputs.wheel_name }}
          retention-days: 90

      - name: Summary
        run: |
          echo "## PyMuPDF WASM Wheel Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wheel | \`${{ steps.wheel.outputs.wheel_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pyodide version | \`${{ env.PYODIDE_VER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke test | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-committed | Yes |" >> $GITHUB_STEP_SUMMARY
