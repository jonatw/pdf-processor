name: Build PyMuPDF WASM Wheel

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      pyodide_version:
        description: 'Pyodide version for build + smoke test'
        required: false
        default: '0.29.3'  # pyodide-version-pin
      pymupdf_version:
        description: 'PyMuPDF version (empty = latest)'
        required: false
        default: '1.27.1'  # pymupdf-version-pin

# Allow pushing commits and triggering other workflows
permissions:
  contents: write
  actions: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYODIDE_VER: ${{ inputs.pyodide_version || '0.29.3' }}  # fallback matches pin above

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build PyMuPDF WASM wheel with cibuildwheel
        run: |
          echo "=== Building PyMuPDF WASM wheel ==="
          echo "Pyodide version: ${{ env.PYODIDE_VER }}"

          pip install cibuildwheel

          # Clone PyMuPDF source
          PYMUPDF_VER="${{ inputs.pymupdf_version }}"
          if [ -n "$PYMUPDF_VER" ]; then
            echo "Cloning PyMuPDF version: $PYMUPDF_VER"
            git clone --depth 1 --branch "$PYMUPDF_VER" https://github.com/pymupdf/PyMuPDF.git /tmp/PyMuPDF
          else
            echo "Cloning PyMuPDF latest"
            git clone --depth 1 https://github.com/pymupdf/PyMuPDF.git /tmp/PyMuPDF
          fi

          cd /tmp/PyMuPDF

          # Determine Python version from Pyodide version
          # Pyodide 0.26.x = Python 3.12, Pyodide 0.27.x = Python 3.12, Pyodide 0.28+ = Python 3.13
          PYODIDE_MINOR=$(echo "${{ env.PYODIDE_VER }}" | cut -d. -f2)
          if [ "$PYODIDE_MINOR" -ge 28 ]; then
            CIBW_PY="cp313-*"
            echo "Pyodide >= 0.28 → building for Python 3.13"
          else
            CIBW_PY="cp312-*"
            echo "Pyodide < 0.28 → building for Python 3.12"
          fi

          # Build WASM wheel using cibuildwheel with Pyodide platform
          CIBW_ENVIRONMENT_PASS_LINUX="HAVE_LIBCRYPTO HAVE_TESSERACT" \
          HAVE_LIBCRYPTO=no \
          HAVE_TESSERACT=0 \
          CIBW_BUILD="$CIBW_PY" \
          CIBW_PYODIDE_VERSION="${{ env.PYODIDE_VER }}" \
          cibuildwheel --platform pyodide --output-dir /tmp/wheelhouse

          echo "=== Build complete ==="
          ls -lh /tmp/wheelhouse/

      - name: Find and verify wheel
        id: wheel
        run: |
          echo "=== Searching for built wheel ==="
          WHEEL=$(find /tmp/wheelhouse -name "*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "ERROR: No wheel file found!"
            exit 1
          fi
          echo "Found wheel: $WHEEL"
          ls -lh "$WHEEL"
          WHEEL_NAME=$(basename "$WHEEL")
          echo "wheel_path=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$WHEEL_NAME" >> "$GITHUB_OUTPUT"

          # Extract PyMuPDF version from wheel filename (e.g. pymupdf-1.27.1-cp313-...)
          PYMUPDF_BUILT_VER=$(echo "$WHEEL_NAME" | sed 's/pymupdf-\([^-]*\)-.*/\1/')
          echo "pymupdf_version=$PYMUPDF_BUILT_VER" >> "$GITHUB_OUTPUT"

          # Copy to public/wheels/
          cp "$WHEEL" "${{ github.workspace }}/public/wheels/"
          echo "Copied to public/wheels/$WHEEL_NAME"

      - name: Setup Node.js for smoke test
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Smoke test — verify wheel loads in Pyodide
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Smoke test: loading wheel in Pyodide (Node.js) ==="
          npm install pyodide@${{ env.PYODIDE_VER }}

          node << 'NODEEOF'
          const { loadPyodide } = require("pyodide");

          async function main() {
            console.log("Loading Pyodide...");
            const pyodide = await loadPyodide();

            console.log("Installing micropip...");
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");

            const wheelName = "${{ steps.wheel.outputs.wheel_name }}";
            console.log(`Installing wheel: ${wheelName}`);
            await micropip.install(`file:public/wheels/${wheelName}`);

            console.log("Testing import fitz...");
            const result = await pyodide.runPythonAsync(`
          import fitz
          version = fitz.version
          print(f"PyMuPDF version: {version}")
          f"PyMuPDF {version[0]} loaded successfully"
            `);
            console.log(`Result: ${result}`);
            console.log("Smoke test PASSED!");
          }

          main().catch(e => {
            console.error("Smoke test FAILED:", e.message);
            process.exit(1);
          });
          NODEEOF

      - name: Commit wheel and update version tracking
        run: |
          WHEEL_NAME="${{ steps.wheel.outputs.wheel_name }}"
          PYMUPDF_VER="${{ steps.wheel.outputs.pymupdf_version }}"
          OLD_WHEELS=$(ls public/wheels/*.whl 2>/dev/null | grep -v "$WHEEL_NAME" || true)

          # Remove old wheel(s) if filename changed
          if [ -n "$OLD_WHEELS" ]; then
            echo "Removing old wheel(s): $OLD_WHEELS"
            rm -f $OLD_WHEELS
          fi

          # Update pyodide-versions.json to track successful build
          cat > pyodide-versions.json << VJSON
          {
            "pyodide": "${{ env.PYODIDE_VER }}",
            "pymupdf": "$PYMUPDF_VER",
            "wheel": "$WHEEL_NAME",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          VJSON

          # Update workflow defaults to last successful versions
          sed -i "s|default: '0\.[0-9]*\.[0-9]*'  # pyodide-version-pin|default: '${{ env.PYODIDE_VER }}'  # pyodide-version-pin|" .github/workflows/build-wheel.yml
          sed -i "s|default: '[0-9]*\.[0-9]*\.[0-9]*'  # pymupdf-version-pin|default: '$PYMUPDF_VER'  # pymupdf-version-pin|" .github/workflows/build-wheel.yml

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/wheels/ pyodide-versions.json

          # Update Pyodide CDN version in worker.js and index.html
          CURRENT_CDN_VER=$(grep -oP 'pyodide/v\K[0-9]+\.[0-9]+\.[0-9]+' public/worker.js | head -1 || true)
          if [ -n "$CURRENT_CDN_VER" ] && [ "$CURRENT_CDN_VER" != "${{ env.PYODIDE_VER }}" ]; then
            echo "Updating Pyodide CDN: v$CURRENT_CDN_VER → v${{ env.PYODIDE_VER }}"
            sed -i "s|pyodide/v$CURRENT_CDN_VER|pyodide/v${{ env.PYODIDE_VER }}|g" public/worker.js
            sed -i "s|pyodide/v$CURRENT_CDN_VER|pyodide/v${{ env.PYODIDE_VER }}|g" index.html
            git add public/worker.js index.html

            # Bump Service Worker cache version to force refresh
            CURRENT_CACHE=$(grep -oP "pdf-remover-v\K[0-9]+" public/sw.js || echo "0")
            NEW_CACHE=$((CURRENT_CACHE + 1))
            sed -i "s|pdf-remover-v$CURRENT_CACHE|pdf-remover-v$NEW_CACHE|" public/sw.js
            git add public/sw.js
            echo "Bumped CACHE_NAME to pdf-remover-v$NEW_CACHE"
          fi

          # Update worker.js if wheel filename changed
          CURRENT_WHEEL=$(grep -oP "wheels/[^'\"]*\.whl" public/worker.js || true)
          if [ -n "$CURRENT_WHEEL" ] && [ "$CURRENT_WHEEL" != "wheels/$WHEEL_NAME" ]; then
            echo "Updating PYMUPDF_WHEEL_PATH in worker.js: $CURRENT_WHEEL → wheels/$WHEEL_NAME"
            sed -i "s|$CURRENT_WHEEL|wheels/$WHEEL_NAME|g" public/worker.js
            git add public/worker.js

            if grep -q "$CURRENT_WHEEL" public/sw.js; then
              sed -i "s|$CURRENT_WHEEL|wheels/$WHEEL_NAME|g" public/sw.js
              git add public/sw.js
            fi
          fi

          # Check if anything changed
          if git diff --cached --quiet && git diff --quiet .github/workflows/build-wheel.yml; then
            echo "Wheel unchanged, skipping commit."
          else
            git add .github/workflows/build-wheel.yml
            git commit -m "ci: rebuild PyMuPDF WASM wheel ($WHEEL_NAME)

          Pyodide: ${{ env.PYODIDE_VER }}
          PyMuPDF: $PYMUPDF_VER
          Smoke test: passed"
            git push
            echo "Committed and pushed new wheel."
          fi

      - name: Trigger deploy to GitHub Pages
        run: |
          echo "=== Triggering deploy workflow ==="
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload wheel as artifact (backup)
        uses: actions/upload-artifact@v7
        with:
          name: pymupdf-wasm-wheel
          path: public/wheels/${{ steps.wheel.outputs.wheel_name }}
          retention-days: 90

      - name: Summary
        run: |
          echo "## PyMuPDF WASM Wheel Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wheel | \`${{ steps.wheel.outputs.wheel_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PyMuPDF | \`${{ steps.wheel.outputs.pymupdf_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pyodide | \`${{ env.PYODIDE_VER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke test | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy triggered | Yes |" >> $GITHUB_STEP_SUMMARY
