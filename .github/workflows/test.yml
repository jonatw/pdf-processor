# PR gate: the site must build AND the WASM path must work.
name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  wasm-test:
    # Runs the python_core suite + e2e watermark removal inside Pyodide against the
    # committed wheel (public/wheels/). Catches PRs — including dependabot dep bumps —
    # that break the WASM path, which dependabot itself can't see. No emscripten build
    # here; it exercises the committed wheel, so it does not depend on the wheel-rebuild
    # toolchain (that's the build-wheel workflow + issue #7).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:wasm

  e2e:
    # Browser-level UAT: Playwright (Chromium + WebKit) against vite preview.
    # Catches missing self-hosted wheels, SPA-fallback HTML, cross-origin WASM errors (#32/#33 class).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
