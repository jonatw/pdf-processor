# Auto-merge dependabot PRs once CI is green (patch/minor only).
# Major bumps are left open for human/agent review.
name: dependabot-automerge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # One API call now, not a 30-minute poll.
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
      - name: Enable auto-merge (patch/minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # Renamed from "Merge after CI passes": this step does not wait for anything.
        # `--auto` hands enforcement to GitHub, which gates on every required check plus
        # the approval -- so the poll that used to live here added no safety on top of
        # that, while holding a hosted runner open for up to 30 minutes per PR to watch
        # something GitHub watches for free.
        #
        # !! That equivalence holds ONLY where branch protection actually requires the
        # check. Before copying this file to another repo, read its protection first:
        #     gh api repos/OWNER/REPO/branches/main --jq .protection.required_status_checks
        # (not the `/branches/main/protection` endpoint -- that one needs admin and
        # returns 403 `Resource not accessible by integration` to App/agent tokens,
        # which is who usually does the copying around here.)
        # A repo with `required_status_checks: null` and only a review requirement merges
        # the instant someone approves -- red CI included. There the poll loop is the only
        # gate and removing it is a regression, not a cleanup. That was literally the case
        # in the sibling repo until its `unittest` context was made required on
        # 2026-08-04; this comment exists so the next person checks instead of assuming.
        #
        # Calling immediately also avoids the `enablePullRequestAutoMerge`
        # "Pull request is in clean status" failure -- but the load-bearing reason is not
        # "checks are still pending", it is that a Dependabot PR here is BLOCKED on the
        # required approving review from the moment it opens, so auto-merge always has
        # something left to wait for.
        #
        # Trade-off accepted: a FAILING check no longer produces a red run *in this
        # workflow*. Auto-merge never fires and the PR sits open.
        #
        # !! Do NOT write that off as "the signal just moves to the test run". The first
        # version of this comment said exactly that, and for months it was wrong in the
        # way that matters: gh_events pushed a `workflow_run` failure only when
        # `head_branch == "main"`, and a Dependabot PR lives on `dependabot/*`, so
        # nothing actively told anyone.
        #
        # Fixed 2026-08-04: openab-infra PR 361 widened that filter to `main` OR
        # `dependabot/*` (merged 10:42Z, Lambda deployed 10:43Z; verified still in place
        # on `main` 2026-08-11). A red required check on a Dependabot PR should now reach
        # Discord within a minute -- code and deploy verified, NOT observed live yet: no
        # `dependabot/*` run has failed anywhere in the fleet since 2026-07-30, so the
        # widened filter has had no real event to prove itself on. If the next red bump
        # still goes unannounced, start here.
        # Scale of what used to be dropped -- the correction
        # comment on openab-infra#359, 2026-08-04T05:36Z:
        # https://github.com/jonatw/openab-infra/issues/359#issuecomment-5175049193
        # 17 failures on `dependabot/*` across the three automerge repos (15 real CI
        # reds, 2 merge races), none pushed. That supersedes the "3" in the issue body,
        # and it is a sample bounded by GitHub's run retention, not a full census.
        #
        # Two gaps remain, both accepted, and neither is "nobody ever finds out":
        #   - THIS workflow's own red is excluded from the fast path (most are merge
        #     races against a PR that got merged in the same minute). It still surfaces
        #     through `fleet_backfill`, the hourly `/actions/runs` sweep, at digest
        #     latency rather than push latency.
        #   - A bump that never goes red -- just sits there unmerged -- emits no failure
        #     event at all, so there is nothing to push. That is what a scheduled
        #     watchdog sweeping open Dependabot PRs would catch, tracked in
        #     openab-infra#365 (open and unassigned as of 2026-08-11). It replaced the
        #     per-repo version once tracked in #74 here, which is closed not_planned --
        #     do not send anyone to that issue. #75 is the adjacent hole: close-stale-prs
        #     GCs a stuck PR at day 28, erasing the very thing a watchdog would watch.
        #
        # Worth knowing: the poll loop this replaced was NOT a safety net either -- its
        # red run also lived on `dependabot/*` and was dropped by the same filter for as
        # long as that filter stood. Poll and `--auto` are equivalent for notification;
        # the poll just also burned 30 runner-minutes per PR. Removing it did not cost a
        # signal that existed.
        #
        # (close-stale-prs.yml eventually GCs a stuck PR -- stale-days 21 +
        # response-days 7 = 28 days -- but that is garbage collection, not a failure
        # signal, and Dependabot reopens the same bump next round anyway. Do not read it
        # as a safety net.)
        #
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --auto
