# Auto-merge dependabot PRs once CI is green (patch/minor only).
# Major bumps are left open for human/agent review.
name: dependabot-automerge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # One API call now, not a 30-minute poll.
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
      - name: Enable auto-merge (patch/minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # Renamed from "Merge after CI passes": this step does not wait for anything.
        # `--auto` hands enforcement to GitHub, which gates on every required check plus
        # the approval -- so the poll that used to live here added no safety on top of
        # that, while holding a hosted runner open for up to 30 minutes per PR to watch
        # something GitHub watches for free.
        #
        # !! That equivalence holds ONLY where branch protection actually requires the
        # check. Before copying this file to another repo, read its protection first:
        #     gh api repos/OWNER/REPO/branches/main --jq .protection.required_status_checks
        # (not the `/branches/main/protection` endpoint -- that one needs admin and
        # returns 403 `Resource not accessible by integration` to App/agent tokens,
        # which is who usually does the copying around here.)
        # A repo with `required_status_checks: null` and only a review requirement merges
        # the instant someone approves -- red CI included. There the poll loop is the only
        # gate and removing it is a regression, not a cleanup. That was literally the case
        # in the sibling repo until its `unittest` context was made required on
        # 2026-08-04; this comment exists so the next person checks instead of assuming.
        #
        # Calling immediately also avoids the `enablePullRequestAutoMerge`
        # "Pull request is in clean status" failure -- but the load-bearing reason is not
        # "checks are still pending", it is that a Dependabot PR here is BLOCKED on the
        # required approving review from the moment it opens, so auto-merge always has
        # something left to wait for.
        #
        # Trade-off accepted: a FAILING check no longer produces a red run *in this
        # workflow*. Auto-merge never fires and the PR sits open.
        #
        # !! Do NOT write that off as "the signal just moves to the test run". The first
        # version of this comment said exactly that and it was wrong in the way that
        # matters. The CI workflow does go red and GitHub does emit the `workflow_run`
        # event, but the fleet notifier drops it: gh_events only pushes a `workflow_run`
        # failure when `head_branch == "main"`, and a Dependabot PR lives on
        # `dependabot/*`. So today NOTHING actively tells anyone. Evidence and fix:
        # openab-infra#359 (3 real failures on dependabot branches in this fleet, 0
        # pushed) and openab-infra PR 361, still open as of 2026-08-04.
        #
        # Worth knowing: the poll loop this replaced was NOT the safety net either -- its
        # red run was also on a `dependabot/*` branch and was dropped by the same filter.
        # Poll and `--auto` are equivalent for notification; the poll just also burned
        # 30 runner-minutes per PR. Removing it did not cost a signal that existed.
        #
        # The real fix is a scheduled watchdog that sweeps open Dependabot PRs and goes
        # red on its own -- tracked in #74 (and #75 for how close-stale-prs erases that signal at day 28).
        #
        # (close-stale-prs.yml eventually GCs a stuck PR -- stale-days 21 +
        # response-days 7 = 28 days -- but that is garbage collection, not a failure
        # signal, and Dependabot reopens the same bump next round anyway. Do not read it
        # as a safety net.)
        #
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --auto
