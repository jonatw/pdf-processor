# Group updates so dependabot opens 1-2 batched PRs/week instead of one per dep
# (avoids the pile-up + serial rebase churn). Grouped PRs still run full CI, incl.
# the wasm-test job — so a WASM-breaking bump is caught even though dependabot can't
# see the WASM constraint itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
