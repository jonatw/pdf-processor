# Group minor+patch → 1 batched PR/week (auto-mergeable). Major bumps stay individual
# so a breaking major doesn't block the safe batch (Gemini code-review 建議).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pyodide version is managed by scripts/build-wasm-wheel.sh (atomically
      # updates worker.js CDN URL, index.html preloads, pyodide-versions.json,
      # and the committed wheel). A standalone npm bump would create a
      # test-runtime / production mismatch that the wasm-test CI blocks — but
      # suppressing the PR avoids unnecessary noise.
      - dependency-name: "pyodide"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
